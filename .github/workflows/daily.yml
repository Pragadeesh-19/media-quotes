name: daily

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      start:
        description: "Backfill start date (YYYY-MM-DD). Leave empty for the daily run only."
        required: false
      end:
        description: "Backfill end date (YYYY-MM-DD)"
        required: false
      source:
        description: "Limit the backfill to one source id (empty means all sources)"
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mqc
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - uses: actions/cache@v4
        with:
          path: .cache/llm
          key: llm-${{ github.run_id }}
          restore-keys: llm-
      - name: Backfill
        if: ${{ inputs.start != '' }}
        env:
          MQC_LLM_API_KEY: ${{ secrets.MQC_LLM_API_KEY }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          SOURCE: ${{ inputs.source }}
        run: mqc backfill --start "$START" --end "$END" ${SOURCE:+--source "$SOURCE"} --max-llm-calls 400
      - name: Daily collection and digest
        env:
          MQC_LLM_API_KEY: ${{ secrets.MQC_LLM_API_KEY }}
        run: mqc daily --max-llm-calls 300
      - name: Commit collected data
        if: ${{ always() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data digests logs
          git diff --cached --quiet || git commit -m "Collect quotes for $(date -u +%F)"
          git pull --rebase
          git push
      - run: mqc site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
